<!DOCTYPE html>
<!-- Tell the browser that this document uses HTML5. -->

<html lang="en">
<!-- The html element contains the entire webpage. -->

<head>
    <!-- Information about the webpage goes here. -->

    <meta charset="UTF-8">
    <!-- Allows the browser to display text characters correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Helps the webpage display properly on different screen sizes. -->

    <title>Stellafy | Small Purchases, Brighter Futures</title>
    <!-- The title appears on the browser tab. -->

    <!-- Load our CSS file to style the homepage. -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>
    <!-- The body contains everything visitors see on the webpage. -->

    <h1>Welcome to Stellafy!</h1>
    <!-- h1 represents the main heading. -->

    <p>Small purchases. Brighter futures.</p>
    <!-- p represents a paragraph of text. -->

    <h2>Shop With Purpose</h2>
    <!-- h2 represents a second-level heading. -->

    <p>
        Every purchase can help support education,
        protect the environment, and strengthen communities.
    </p>

    <button>Explore Products</button>
    <!-- A button visitors will eventually use to browse products. -->
</body>

</html>
